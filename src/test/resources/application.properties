# Sólo para la suite: ningún test abre conexión con RabbitMQ.
# La mensajería se prueba con dobles y con el test de integración contra un broker
# real, que reactiva estas propiedades de forma explícita.
spring.rabbitmq.dynamic=false
spring.rabbitmq.listener.simple.auto-startup=false
app.outbox.publisher-enabled=false

# El envío del voucher corre en el hilo de la petición para que las aserciones
# no dependan de hilos; ningún test abre SMTP.
app.guest.mail.executor-threads=0
app.guest.mail.frontend-public-url=http://localhost:4200
