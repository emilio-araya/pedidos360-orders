spring:
  application:
    name: ms-pedidos360-orders
  profiles:
    default: oracle
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 5s
    # El publicador espera la confirmación del broker antes de dar el evento por publicado.
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # Ack manual: ResilientConsumer confirma sólo después de procesar.
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

  mail:
    # Mailpit en local y Amazon SES en AWS: mismas variables, distinto host.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

management:
  health:
    # Sin SMTP configurado no hay que marcar el servicio como caído.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0

app:
  guest:
    mail:
      from: ${MAIL_FROM:no-reply@pedidos360.local}
      # Base del enlace de seguimiento que viaja en el correo.
      frontend-public-url: ${FRONTEND_PUBLIC_URL:http://localhost:4200}
      # 0 ejecuta el envío en el hilo de la petición: sólo para tests.
      executor-threads: ${GUEST_MAIL_EXECUTOR_THREADS:2}
  security:
    issuer: ${ENTRA_ISSUER}
    audience: ${ENTRA_API_AUDIENCE}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    connect-timeout-ms: ${CATALOG_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CATALOG_READ_TIMEOUT_MS:10000}
  outbox:
    # Los tests lo desactivan en src/test/resources/application.properties.
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    publisher-delay-ms: ${OUTBOX_PUBLISHER_DELAY_MS:2000}
    confirm-timeout-ms: ${OUTBOX_CONFIRM_TIMEOUT_MS:5000}

logging:
  level:
    # Logs the URI of the first request at WARN; guest routes carry the secret
    # tracking token in the path, and it must never reach the logs.
    org.springframework.web.servlet.handler.HandlerMappingIntrospector: ERROR
  pattern:
    # %X{requestId} imprime el id de correlación; "-" cuando no hay request en curso.
    level: "%5p [%X{requestId:--}]"
