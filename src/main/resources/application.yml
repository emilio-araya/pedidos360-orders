spring:
  application:
    name: ms-pedidos360-orders
  profiles:
    default: oracle
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0

app:
  security:
    issuer: ${ENTRA_ISSUER}
    audience: ${ENTRA_API_AUDIENCE}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
